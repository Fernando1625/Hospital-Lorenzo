
<header class="navbar">

  <!-- Identificación del sistema -->
  <div class="navbar-marca">

    <div class="logo-hospital">
      +
    </div>

    <div class="marca-textos">
      <strong>Hospital-Lorenzo</strong>
      <span>Sistema de Gestión Hospitalaria</span>
    </div>

  </div>

  <!-- Información del usuario -->
  <div class="navbar-usuario">

    @if (usuarioActual(); as usuario) {

      <div class="usuario-icono" aria-hidden="true">
        {{ usuario.nombres.charAt(0).toUpperCase() }}
      </div>

      <div class="usuario-datos">
        <strong>
          {{ usuario.nombres }} {{ usuario.apellidos }}
        </strong>

        <span>{{ usuario.rol }}</span>
      </div>

    } @else {

      <div class="usuario-icono" aria-hidden="true">
        ?
      </div>

      <div class="usuario-datos">
        <strong>Sin sesión de demostración</strong>
        <span>Acceso no identificado</span>
      </div>

    }

    <!-- Cerrar sesión -->
    <button
      type="button"
      class="btn-salir"
      (click)="cerrarSesion()">

      Cerrar sesión

    </button>

  </div>

</header>
